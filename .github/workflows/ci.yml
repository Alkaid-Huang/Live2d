name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        # 只装核心层与开发工具。GUI 与渲染依赖在 .[gui] 里，CI 不装。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格
        run: ruff check src tests

      - name: 类型检查
        run: mypy src

      - name: 单元测试
        run: pytest -q
