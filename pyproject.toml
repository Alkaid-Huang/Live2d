[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live2d-agent"
version = "0.1.0"
description = "Agent 驱动的 Live2D 数字角色"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "edge-tts>=6.1",
    "litellm>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# GUI 与渲染依赖单独一组：CI 只装 .[dev]，不装这一组（见 docs/adr/0002）。
# live2d-py 只发布到 cp311 的 wheel（不是 abi3），所以 Python 版本必须钉在 3.11。
gui = [
    "PyQt5>=5.15.11",
    "pygame>=2.6",
    "live2d-py>=0.7.0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
package-dir = { "" = "src" }
# 每新增一个顶层模块（src/*.py）或子包（src/<pkg>/），都要在下面两行同步登记。
py-modules = ["config", "events", "main", "runtime"]
packages = ["llm", "tts", "emotion", "stage", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不装包也能直接跑测试；CI 里另外会 pip install -e . 验证打包声明。
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# 这些库要么类型标注随版本波动，要么根本没有 stubs，不让它们挡住我们自己的代码。
# live2d 是 live2d-py 提供的模块名，与本项目的 stage 包不冲突。
module = [
    "litellm",
    "litellm.*",
    "edge_tts",
    "edge_tts.*",
    "PyQt5",
    "PyQt5.*",
    "pygame",
    "pygame.*",
    "live2d",
    "live2d.*",
    "OpenGL",
    "OpenGL.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
# docs/product.md 的成功指标只算核心层：界面与渲染进程不计入——CI 里没有显示器，
# 也不装 GUI 依赖，它们跑不起来。代价是这两个文件必须保持"薄壳"：逻辑一律放在
# 有测试的模块里，别往 renderer 和界面里堆判断。
omit = [
    "src/main.py",
    # 只排除窗口这层薄壳：ui/state.py 是纯逻辑、CI 测得到，要计入指标。
    "src/ui/window.py",
    "src/stage/renderer.py",
]

[tool.coverage.report]
# docs/product.md 的成功指标：核心层行覆盖率 ≥ 80%。
# 门禁写在这里而不是 CI 脚本里，本地跑 --cov 时同样受约束。
fail_under = 80
show_missing = true
